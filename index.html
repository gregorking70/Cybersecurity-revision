const KEY='cyber-revision-v2-progress';
const oldKeys=['cyber-revision-progress','cybersecurity-revision-progress'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={history:{},sessions:[],settings:{},started:null};
let current=null,tab='home',toastTimer;
try{let v=localStorage.getItem(KEY);if(v){let p=JSON.parse(v);if(p&&typeof p==='object')state={...state,...p};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('storage').textContent='Progress saved on this device';return true}catch(e){$('storage').textContent='Storage unavailable — export backups regularly';return false}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}
function records(){return Object.values(state.history).filter(x=>x&&typeof x==='object')}
function stats(arr=BANK){let n=0,c=0,attempted=0,mastered=0;for(const q of arr){let r=state.history[q.id];if(r){attempted++;n+=r.attempts||0;c+=r.correct||0;if((r.attempts||0)>=2&&(r.correct||0)/(r.attempts||1)>=.8)mastered++}}return {n,c,attempted,mastered,pct:n?Math.round(100*c/n):0}}
function seen(q){return state.history[q.id]||{attempts:0,correct:0,wrong:0,last:0}}
function go(t){tab=t;current=null;render()}
function subjects(){return [...new Set(BANK.map(q=>q.subject))]}
function bar(p){return `<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`}
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab)})}
function render(){nav();let s=stats();if(tab==='home')home(s);if(tab==='practice')practice();if(tab==='stats')dashboard();if(tab==='review')review();if(tab==='settings')settings()}
function home(s){$('main').innerHTML=`<div class="card"><div class="tag">YOUR LEARNING HUB</div><h2>Ready for a session?</h2><p class="muted">${BANK.length} questions across ${subjects().length} subjects. Study at your pace, then revisit the topics you miss.</p><button class="primary" data-action="quick">Quick 10-question quiz →</button></div><div class="grid"><div class="card"><small>Total attempts</small><div class="metric">${s.n}</div></div><div class="card"><small>Lifetime accuracy</small><div class="metric">${s.pct}%</div></div><div class="card"><small>Questions attempted</small><div class="metric">${s.attempted}/${BANK.length}</div>${bar(Math.round(100*s.attempted/BANK.length))}</div><div class="card"><small>Mastered questions</small><div class="metric">${s.mastered}</div><small>At least 2 attempts and 80%+ correct</small></div></div><h2>Subjects</h2><div class="grid">${subjects().map(x=>{let a=BANK.filter(q=>q.subject===x),t=stats(a);return `<div class="card"><h3>${esc(x)}</h3><div class="between"><small>${t.attempted}/${a.length} tried</small><b>${t.pct}% accuracy</b></div>${bar(Math.round(100*t.attempted/a.length))}<button data-subject="${esc(x)}">Practise subject →</button></div>`}).join('')}</div>`}
function practice(){let subj=state.settings.subject||'All subjects',mode=state.settings.mode||'quiz',size=state.settings.size||'10';$('main').innerHTML=`<div class="card"><h2>Start a practice session</h2><label>Subject</label><select id="subject">${['All subjects',...subjects()].map(x=>`<option ${x===subj?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Practice method</label><select id="mode"><option value="quiz" ${mode==='quiz'?'selected':''}>Multiple-choice quiz</option><option value="flash" ${mode==='flash'?'selected':''}>Flashcards (reveal & self-grade)</option><option value="written" ${mode==='written'?'selected':''}>Written recall (type then self-grade)</option><option value="weak" ${mode==='weak'?'selected':''}>Weak areas (missed questions)</option><option value="new" ${mode==='new'?'selected':''}>Unseen questions only</option><option value="exam" ${mode==='exam'?'selected':''}>Exam mode (feedback at end)</option></select><label>Questions per session</label><select id="size">${['5','10','20','30','All'].map(x=>`<option ${size===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary" data-action="start">Start session →</button></div><div class="card"><h3>How practice works</h3><p class="muted">Flashcards and written recall let you mark your own answer. Weak areas select questions you have missed. Exam mode hides results until the end. All completed answers contribute to your statistics.</p></div>`}
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startSession(forceSubject){let sub=forceSubject||$('subject')?.value||'All subjects',mode=$('mode')?.value||'quiz',size=$('size')?.value||'10';state.settings={subject:sub,mode,size};let pool=BANK.filter(q=>sub==='All subjects'||q.subject===sub);if(mode==='weak')pool=pool.filter(q=>seen(q).wrong>0);if(mode==='new')pool=pool.filter(q=>seen(q).attempts===0);if(!pool.length){toast('No matching questions yet. Try another mode.');return}pool=shuffle(pool).sort((a,b)=>seen(a).attempts-seen(b).attempts);let count=size==='All'?pool.length:Math.min(Number(size),pool.length);current={ids:pool.slice(0,count).map(q=>q.id),i:0,mode,answers:[],started:Date.now(),revealed:false,selected:null};state.started={...current};save();drawQuestion()}
function qnow(){return BANK.find(q=>q.id===current.ids[current.i])}
function drawQuestion(){if(!current)return;let q=qnow(),m=current.mode,rec=current.answers[current.i];let top=`<div class="between"><span class="tag">${esc(q.subject)} · ${esc(m.toUpperCase())}</span><span class="pill">${current.i+1} / ${current.ids.length}</span></div>${bar(Math.round(100*current.i/current.ids.length))}<div class="question">${esc(q.q)}</div>`;let body='';if(m==='quiz'||m==='weak'||m==='new'||m==='exam'){body=q.options.map((x,i)=>`<button class="choice ${rec&&m!=='exam'?(i===q.answer?'correct':i===rec.choice?'wrong':''):''}" data-choice="${i}" ${rec?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(x)}</button>`).join('');if(rec&&m!=='exam')body+=`<div class="answer"><b>${rec.ok?'Correct ✓':'Incorrect ✕'}</b><p>${esc(q.explain)}</p></div>`}else if(m==='flash'){body=`<div class="card" style="background:#1b3044"><small>Think of your answer before revealing.</small>${current.revealed?`<h3>${esc(q.options[q.answer])}</h3><p>${esc(q.explain)}</p><div class="flex"><button data-grade="1" class="primary">I knew it ✓</button><button data-grade="0">Need to revise</button></div>`:`<button data-action="reveal" class="primary">Reveal answer</button>`}</div>`}else{body=`<label>Your answer</label><textarea id="written" rows="3" placeholder="Type what you remember…" ${current.revealed?'disabled':''}>${esc(current.typed||'')}</textarea>${current.revealed?`<div class="answer"><b>Suggested answer: ${esc(q.options[q.answer])}</b><p>${esc(q.explain)}</p></div><div class="flex"><button data-grade="1" class="primary">I was correct ✓</button><button data-grade="0">I need practice</button></div>`:`<button data-action="reveal">Check answer</button>`}`}
if(rec)body+=`<button class="primary" data-action="next">${current.i+1===current.ids.length?'Finish session':'Next question →'}</button>`;
$('main').innerHTML=`<div class="card">${top}${body}<div class="flex" style="margin-top:18px"><button class="secondary" data-action="quit">Exit session</button></div></div>`}
function answer(ok,choice){let q=qnow();if(current.answers[current.i])return;current.answers[current.i]={id:q.id,ok,choice,at:Date.now()};let r=seen(q);r.attempts++;if(ok)r.correct++;else r.wrong++;r.last=Date.now();state.history[q.id]=r;current.revealed=false;state.started={...current};save();drawQuestion()}
function next(){current.i++;current.selected=null;current.typed='';current.revealed=false;if(current.i>=current.ids.length){finish();return}state.started={...current};save();drawQuestion()}
function finish(){let answers=current.answers,correct=answers.filter(a=>a.ok).length;state.sessions.unshift({date:Date.now(),mode:current.mode,subject:state.settings.subject||'All subjects',total:answers.length,correct});state.sessions=state.sessions.slice(0,250);state.started=null;let m=current.mode;current=null;save();$('main').innerHTML=`<div class="card"><div class="tag">SESSION COMPLETE</div><h2>${correct} / ${answers.length} correct</h2><div class="metric">${answers.length?Math.round(correct*100/answers.length):0}%</div>${bar(answers.length?Math.round(correct*100/answers.length):0)}<p class="muted">Your answers have been saved to your dashboard.</p><button class="primary" data-action="another">Practise again</button> <button data-action="dashboard">View statistics</button></div>${m==='exam'?`<div class="card"><h3>Exam answer review</h3>${answers.map((a,i)=>{let q=BANK.find(x=>x.id===a.id);return `<p><b>${i+1}. ${esc(q.q)}</b><br><span class="${a.ok?'':'wrongtext'}">${a.ok?'Correct':'Incorrect'}</span> · ${esc(q.options[q.answer])}<br><small>${esc(q.explain)}</small></p>`}).join('')}</div>`:''}`}
function dashboard(){let s=stats();$('main').innerHTML=`<h2>Progress dashboard</h2><div class="grid"><div class="card"><small>Accuracy across attempts</small><div class="metric">${s.pct}%</div></div><div class="card"><small>Correct answers</small><div class="metric">${s.c} / ${s.n}</div></div><div class="card"><small>Questions explored</small><div class="metric">${s.attempted} / ${BANK.length}</div></div><div class="card"><small>Completed sessions</small><div class="metric">${state.sessions.length}</div></div></div><div class="card"><h3>Subject performance</h3>${subjects().map(x=>{let a=BANK.filter(q=>q.subject===x),t=stats(a);return `<div style="margin:15px 0"><div class="between"><b>${esc(x)}</b><span>${t.pct}% · ${t.attempted}/${a.length} explored</span></div>${bar(t.pct)}</div>`}).join('')}</div><div class="card"><h3>Recent sessions</h3>${state.sessions.length?state.sessions.slice(0,15).map(s=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--border)"><div><b>${esc(s.subject)}</b><br><small>${new Date(s.date).toLocaleDateString()} · ${esc(s.mode)}</small></div><b>${s.correct}/${s.total}</b></div>`).join(''):'<p class="muted">Complete a session to see your history.</p>'}</div>`}
function review(){let missed=BANK.filter(q=>seen(q).wrong>0).sort((a,b)=>seen(b).wrong-seen(a).wrong),newq=BANK.filter(q=>!seen(q).attempts);$('main').innerHTML=`<h2>Revision priorities</h2><div class="card"><h3>Questions you've missed (${missed.length})</h3>${missed.length?missed.slice(0,35).map(q=>`<div style="border-bottom:1px solid var(--border);padding:10px 0"><div class="tag">${esc(q.subject)} · ${seen(q).wrong} incorrect</div><b>${esc(q.q)}</b><p class="muted mini">${esc(q.options[q.answer])} — ${esc(q.explain)}</p></div>`).join(''):'<p class="muted">No incorrect answers recorded yet.</p>'}</div><div class="card"><h3>Unseen questions</h3><p>${newq.length} questions you haven't tried yet.</p><button data-action="new">Practise unseen questions →</button></div>`}
function settings(){$('main').innerHTML=`<h2>Data & backups</h2><div class="card"><h3>Automatic local saving</h3><p class="muted">Your answer history is saved on this iPhone. It is not synced to GitHub or other devices. Export a backup before clearing browser data or replacing your phone.</p><p class="tag">${esc($('storage').textContent)}</p><button class="primary" data-action="export">Export progress backup (.json)</button><label>Restore a saved backup</label><input type="file" id="import" accept=".json,application/json"><button data-action="import">Import selected backup</button></div><div class="card"><h3 class="danger">Reset progress</h3><p class="muted">This permanently clears scores and sessions on this device.</p><button data-action="reset">Reset all progress</button></div><div class="card"><h3>About</h3><p>${BANK.length} curated questions across ${subjects().length} subjects. Self-graded written and flashcard answers are included in accuracy calculations. Statistics are based on all attempts, not just unique questions.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'cyber-revision-v2',exported:new Date().toISOString(),state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cyber-revision-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup ready — save it in Files')}
function importData(){let f=$('import')?.files?.[0];if(!f){toast('Choose a backup file first');return}let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(obj.app!=='cyber-revision-v2'||!obj.state||typeof obj.state.history!=='object'||!Array.isArray(obj.state.sessions))throw Error('Not a valid backup');if(!confirm('Replace current progress with this backup?'))return;state={history:obj.state.history,sessions:obj.state.sessions,settings:obj.state.settings||{},started:null};save();render();toast('Backup restored')}catch(e){alert('Unable to import: '+e.message)}};r.readAsText(f)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){go(b.dataset.tab);return}if(b.dataset.subject){state.settings={subject:b.dataset.subject,mode:'quiz',size:'10'};go('practice');return}if(b.dataset.choice!==undefined&&current){let q=qnow();answer(Number(b.dataset.choice)===q.answer,Number(b.dataset.choice));return}if(b.dataset.grade!==undefined&&current){answer(b.dataset.grade==='1',null);return}switch(b.dataset.action){case'quick':state.settings={subject:'All subjects',mode:'quiz',size:'10'};startSession('All subjects');break;case'start':startSession();break;case'reveal':if(current){current.typed=$('written')?.value||'';current.revealed=true;state.started={...current};save();drawQuestion()}break;case'next':next();break;case'quit':if(confirm('Exit this session? Completed answers remain saved.')){state.started=null;save();go('practice')}break;case'another':go('practice');break;case'dashboard':go('stats');break;case'new':state.settings={subject:'All subjects',mode:'new',size:'10'};go('practice');break;case'export':exportData();break;case'import':importData();break;case'reset':if(confirm('Delete ALL your saved revision progress? This cannot be undone.')){state={history:{},sessions:[],settings:{},started:null};save();render();toast('Progress reset')}break;}});
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
save();render();
</script></body></html>
